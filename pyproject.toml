[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-manager-desktop"
version = "2.0.0"
description = "Cross-platform MCP discovery, lifecycle and extension manager"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.30,<2", "httpx>=0.27,<1", "pydantic>=2.10,<3", "tomlkit>=0.13,<1", "ruamel.yaml>=0.18,<0.19", "jsonschema>=4.23,<5", "keyring>=25,<26", "cryptography>=44,<51", "packaging>=24,<27"]

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7"]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
mcp-manager = "mcp_manager.cli:main"
mcp-manager-gui = "mcp_manager.gui.app:main"
mcp-manager-server = "mcp_manager.server:main"
mcp-manager-gateway = "mcp_manager.gateway_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: real process or network integration", "gui: Qt offscreen interface"]
